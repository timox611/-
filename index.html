<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollCraft — опросы онлайн</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --accent-1: #7c5cff;
  --accent-2: #23d5ff;
  --accent-3: #ff5cae;
  --accent-4: #4dff9f;
  --glass: rgba(255, 255, 255, 0.06);
  --glass-hover: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.12);
  --text: #eef0ff;
  --text-dim: #8f92b8;
  --danger: #ff5c5c;
  --success: #4dff9f;
}

html, body {
  height: 100%;
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color: var(--text);
  background: #06060f;
  -webkit-font-smoothing: antialiased;
}

#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(124, 92, 255, 0.35), transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(35, 213, 255, 0.25), transparent 60%),
    radial-gradient(ellipse 60% 40% at 0% 100%, rgba(255, 92, 174, 0.2), transparent 60%),
    linear-gradient(180deg, #06060f 0%, #0a0a1c 50%, #06060f 100%);
}

#particles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.app {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= TOPBAR ================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(10, 10, 28, 0.6);
  border-bottom: 1px solid var(--glass-border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  cursor: pointer;
}
.logo-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(124, 92, 255, 0.5);
  animation: logoPulse 4s ease-in-out infinite;
}
.logo-mark svg { width: 18px; height: 18px; }
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 4px 16px rgba(124, 92, 255, 0.5); }
  50% { box-shadow: 0 4px 24px rgba(35, 213, 255, 0.7); }
}
.logo-text {
  background: linear-gradient(135deg, #fff, #b4b8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.topbar-spacer { flex: 1; }

.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  transition: all 0.25s;
}
.user-chip:hover { background: var(--glass-hover); }
.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.user-name { font-size: 14px; font-weight: 600; }

.btn-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-size: 16px;
}
.btn-icon:hover {
  background: var(--glass-hover);
  border-color: rgba(255, 92, 92, 0.5);
  color: var(--danger);
  transform: translateY(-1px);
}

/* ================= BUTTONS ================= */
.btn {
  padding: 12px 22px;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  color: #fff;
  box-shadow: 0 6px 20px rgba(124, 92, 255, 0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(124, 92, 255, 0.6);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-ghost {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
}
.btn-ghost:hover {
  background: var(--glass-hover);
  transform: translateY(-1px);
}
.btn-danger {
  background: rgba(255, 92, 92, 0.15);
  border: 1px solid rgba(255, 92, 92, 0.4);
  color: var(--danger);
}
.btn-danger:hover { background: rgba(255, 92, 92, 0.25); }

/* ================= AUTH ================= */
.auth-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.auth-box {
  width: 100%;
  max-width: 420px;
  background: rgba(18, 18, 42, 0.7);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  animation: slideUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-logo {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 12px 40px rgba(124, 92, 255, 0.55);
  animation: floatY 3s ease-in-out infinite;
}
.auth-logo svg { width: 38px; height: 38px; }
@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.auth-box h1 {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.auth-box p.sub {
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 28px;
}

.tabs {
  display: flex;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
  position: relative;
}
.tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 9px;
  transition: all 0.25s;
  position: relative;
  z-index: 1;
}
.tab.active {
  color: #fff;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  box-shadow: 0 4px 14px rgba(124, 92, 255, 0.4);
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 600;
}
.field input, .field textarea {
  width: 100%;
  padding: 14px 16px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: all 0.2s;
}
.field input:focus, .field textarea:focus {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
  background: rgba(0, 0, 0, 0.5);
}
.field input::placeholder, .field textarea::placeholder { color: rgba(255, 255, 255, 0.25); }
.field textarea { resize: vertical; min-height: 90px; font-size: 15px; }

.err {
  color: var(--danger);
  font-size: 13px;
  margin-top: -8px;
  margin-bottom: 14px;
  min-height: 18px;
  padding-left: 4px;
}

.auth-box .btn { width: 100%; padding: 15px; font-size: 15px; margin-top: 6px; }

/* ================= MAIN ================= */
.container {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

.hero {
  text-align: center;
  padding: 20px 0 40px;
  perspective: 1200px;
}
.hero h1 {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 900;
  letter-spacing: -1.5px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #fff 0%, #b4b8ff 50%, #23d5ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}
.hero p {
  color: var(--text-dim);
  font-size: clamp(14px, 2vw, 17px);
  max-width: 600px;
  margin: 0 auto 24px;
  line-height: 1.6;
}
.hero-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ================= TOOLBAR ================= */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}
.search-box input:focus {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 4px rgba(35, 213, 255, 0.12);
}
.search-box input::placeholder { color: var(--text-dim); }
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  font-size: 16px;
}

.sort-select {
  padding: 12px 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  outline: none;
  transition: all 0.2s;
}
.sort-select:hover { border-color: var(--accent-1); }
.sort-select option { background: #12122a; color: var(--text); }

/* ================= POLL GRID (3D CARDS) ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  perspective: 1400px;
}

.poll-card {
  background: linear-gradient(145deg, rgba(28, 28, 58, 0.85), rgba(16, 16, 40, 0.85));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 22px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  transform-style: preserve-3d;
  will-change: transform;
  animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) backwards;
}
.poll-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(124, 92, 255, 0.5), transparent 40%, transparent 60%, rgba(35, 213, 255, 0.5));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.poll-card:hover::before { opacity: 1; }
.poll-card:hover {
  box-shadow:
    0 30px 60px rgba(0, 0, 0, 0.5),
    0 0 40px rgba(124, 92, 255, 0.2);
}
.poll-card.own {
  border-color: rgba(77, 255, 159, 0.25);
}
.poll-card.own::after {
  content: "Ваш опрос";
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  background: rgba(77, 255, 159, 0.15);
  border: 1px solid rgba(77, 255, 159, 0.4);
  color: var(--success);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.card-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
}
.card-author {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
}
.card-question {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 16px;
  color: #fff;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--text-dim);
}
.card-stat {
  display: flex;
  align-items: center;
  gap: 5px;
}
.card-stat b { color: var(--text); font-weight: 700; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.4;
}
.empty h3 {
  font-size: 18px;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 700;
}
.empty p { font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

/* ================= DETAIL ================= */
.detail {
  max-width: 720px;
  margin: 0 auto;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 24px;
  transition: all 0.2s;
}
.back-btn:hover { background: var(--glass-hover); transform: translateX(-3px); }

.detail-card {
  background: linear-gradient(145deg, rgba(28, 28, 58, 0.85), rgba(16, 16, 40, 0.85));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  animation: slideUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
.detail-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.detail-question {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 24px;
  color: #fff;
  letter-spacing: -0.5px;
}

.options { display: flex; flex-direction: column; gap: 12px; }

.option-btn {
  width: 100%;
  padding: 16px 18px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  display: flex;
  align-items: center;
  gap: 14px;
}
.option-btn:hover {
  border-color: var(--accent-1);
  background: rgba(124, 92, 255, 0.1);
  transform: translateX(4px);
}
.option-radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--text-dim);
  flex-shrink: 0;
  transition: all 0.2s;
}
.option-btn:hover .option-radio { border-color: var(--accent-2); }

.option-result {
  width: 100%;
  padding: 14px 18px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.25s;
}
.option-result.voted {
  border-color: rgba(77, 255, 159, 0.5);
  box-shadow: 0 0 20px rgba(77, 255, 159, 0.15);
}
.option-result-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: linear-gradient(90deg, rgba(124, 92, 255, 0.4), rgba(35, 213, 255, 0.4));
  transition: width 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.05);
  z-index: 0;
}
.option-result.voted .option-result-bar {
  background: linear-gradient(90deg, rgba(77, 255, 159, 0.35), rgba(35, 213, 255, 0.35));
}
.option-result-content {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-result-text {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}
.option-check {
  color: var(--success);
  font-weight: 700;
  font-size: 15px;
}
.option-pct {
  font-size: 15px;
  font-weight: 800;
  color: var(--accent-2);
  min-width: 48px;
  text-align: right;
}
.option-voters {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  position: relative;
  z-index: 1;
  padding-left: 2px;
}

.detail-stats {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--glass-border);
  font-size: 13px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.detail-stats b { color: var(--text); }

.detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* ================= MODAL ================= */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-bg.show { opacity: 1; pointer-events: auto; }

.modal {
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  background: rgba(20, 20, 46, 0.95);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
  transform: scale(0.92);
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
.modal-bg.show .modal { transform: scale(1); }
.modal h2 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.modal .sub {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 22px;
}

.options-edit { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.option-row {
  display: flex;
  gap: 8px;
  align-items: center;
  animation: slideUp 0.25s ease-out;
}
.option-row input {
  flex: 1;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}
.option-row input:focus {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
}
.option-row input::placeholder { color: rgba(255, 255, 255, 0.25); }
.option-remove {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255, 92, 92, 0.1);
  border: 1px solid rgba(255, 92, 92, 0.3);
  color: var(--danger);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.option-remove:hover { background: rgba(255, 92, 92, 0.2); }

.add-option {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px dashed var(--glass-border);
  border-radius: 10px;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.add-option:hover {
  border-color: var(--accent-1);
  color: var(--accent-1);
  background: rgba(124, 92, 255, 0.05);
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  justify-content: flex-end;
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  padding: 14px 24px;
  background: rgba(20, 20, 46, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  z-index: 500;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast.success { border-color: rgba(77, 255, 159, 0.5); }
.toast.error { border-color: rgba(255, 92, 92, 0.5); }

.hidden { display: none !important; }

/* ================= MOBILE ================= */
@media (max-width: 640px) {
  .topbar { padding: 12px 16px; }
  .logo-text { display: none; }
  .user-name { display: none; }
  .user-chip { padding: 6px; }
  .container { padding: 24px 16px 60px; }
  .grid { grid-template-columns: 1fr; }
  .detail-card { padding: 22px; }
  .detail-question { font-size: 20px; }
  .modal { padding: 22px; }
  .btn { padding: 11px 18px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(124, 92, 255, 0.3);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(124, 92, 255, 0.5); }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar hidden" id="topbar">
    <div class="logo" onclick="goHome()">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/>
        </svg>
      </div>
      <span class="logo-text">PollCraft</span>
    </div>

  <!-- AUTH SCREEN -->

    <div class="auth-box">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/>
        </svg>
      </div>
      <h1>PollCraft</h1>
      <p class="sub">Создавайте опросы и делитесь мнением</p>

      <p>Один клик — и ваш вопрос увидят все. Голосуйте, смотрите результаты в реальном времени, делитесь с друзьями.</p>
      <div class="hero-actions">

<!-- CREATE MODAL -->
<div class="modal-bg" id="createModal">
  <div class="modal">

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   POLLCRAFT — одностраничное приложение для опросов
   Данные хранятся в localStorage этого браузера
   ============================================================ */

const DB_KEY = 'pollcraft_db_v1';

let DB = {
  users: {},   // { username: { passHash, createdAt } }
  polls: [],   // [ { id, author, question, options:[{text, voters:[]}], createdAt } ]
  session: null
};

let currentView = 'main'; // main | detail
let currentPollId = null;
let authMode = 'login'; // login | register

/* ============ STORAGE ============ */
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      DB.users = parsed.users || {};
      DB.polls = parsed.polls || [];
      DB.session = parsed.session || null;
    }
  } catch (e) {
    console.error('DB load error', e);
  }
}
function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  } catch (e) {
    console.error('DB save error', e);
  }
}

/* ============ HASH ============ */
function hashPass(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(36);
}

/* ============ UTILS ============ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function initials(name) {
  name = String(name || '?').trim();
  if (!name) return '?';
  const parts = name.split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

const COLORS = [
  '#7c5cff', '#23d5ff', '#ff5cae', '#4dff9f', '#ffa45c',
  '#ff5c5c', '#5c9dff', '#b45cff', '#5cffd5', '#ffcc5c'
];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'только что';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + ' мин назад';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' ч назад';
  const day = Math.floor(hr / 24);
  if (day < 30) return day + ' дн назад';
  return new Date(ts).toLocaleDateString('ru-RU');
}

function totalVotes(poll) {
  let n = 0;
  for (const o of poll.options) n += o.voters.length;
  return n;
}

/* ============ TOAST ============ */
let toastTimer = null;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.className = 'toast ' + type;
  }, 2600);
}

/* ============ AUTH ============ */
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('authErr').textContent = '';
}

function submitAuth() {
  const user = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');

  if (!user || user.length < 2) { err.textContent = 'Имя минимум 2 символа'; return; }
  if (!/^[A-Za-zА-Яа-яЁё0-9_\- ]+$/.test(user)) { err.textContent = 'Только буквы, цифры, пробел, дефис, _'; return; }
  if (!pass || pass.length < 4) { err.textContent = 'Пароль минимум 4 символа'; return; }

  const key = user.toLowerCase();
  const passHash = hashPass(pass);

  if (authMode === 'register') {
    if (DB.users[key]) { err.textContent = 'Такое имя уже занято'; return; }
    DB.users[key] = {
      display: user,
      passHash,
      createdAt: Date.now()
    };
    DB.session = key;
    saveDB();
    toast('Аккаунт создан. Добро пожаловать, ' + user + '!', 'success');
    enterApp();
  } else {
    const u = DB.users[key];
    if (!u) { err.textContent = 'Пользователь не найден'; return; }
    if (u.passHash !== passHash) { err.textContent = 'Неверный пароль'; return; }
    DB.session = key;
    saveDB();
    toast('С возвращением, ' + u.display + '!', 'success');
    enterApp();
  }
}

function logout() {
  DB.session = null;
  saveDB();
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';
  document.getElementById('authErr').textContent = '';
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('detailScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  switchTab('login');
}

function currentUser() {
  if (!DB.session) return null;
  return DB.users[DB.session] ? { key: DB.session, ...DB.users[DB.session] } : null;
}

function enterApp() {
  const u = currentUser();
  if (!u) return;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('topAvatar').textContent = initials(u.display);
  document.getElementById('topAvatar').style.background = colorFor(u.key);
  document.getElementById('topName').textContent = u.display;
  goHome();
}

/* ============ NAVIGATION ============ */
function goHome() {
  currentView = 'main';
  currentPollId = null;
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('detailScreen').classList.add('hidden');
  renderPolls();
}

function openDetail(id) {
  currentPollId = id;
  currentView = 'detail';
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('detailScreen').classList.remove('hidden');
  renderDetail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ RENDER POLLS ============ */
function renderPolls() {
  const grid = document.getElementById('pollGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const u = currentUser();
  if (!u) return;

  let list = DB.polls.slice();

  if (sort === 'mine') {
    list = list.filter(p => p.author === u.key);
  }
  if (q) {
    list = list.filter(p =>
      p.question.toLowerCase().includes(q) ||
      (p.authorDisplay || p.author).toLowerCase().includes(q)
    );
  }

  if (sort === 'popular') {
    list.sort((a, b) => totalVotes(b) - totalVotes(a));
  } else {
    list.sort((a, b) => b.createdAt - a.createdAt);
  }

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📊</div>
        <h3>${q ? 'Ничего не найдено' : (sort === 'mine' ? 'У вас пока нет опросов' : 'Опросов пока нет')}</h3>
        <p>${q ? 'Попробуйте изменить запрос' : 'Создайте первый опрос — нажмите кнопку выше'}</p>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'poll-card' + (p.author === u.key ? ' own' : '');
    card.style.animationDelay = (i * 0.05) + 's';
    const tv = totalVotes(p);
    const hasVoted = p.options.some(o => o.voters.includes(u.key));

    card.innerHTML = `
      <div class="card-head">
        <div class="card-avatar" style="background:${colorFor(p.author)}">${escapeHtml(initials(p.authorDisplay || p.author))}</div>
        <div>
          <div class="card-author">${escapeHtml(p.authorDisplay || p.author)}</div>
          <div class="card-author" style="font-size:11px;opacity:.6">${escapeHtml(timeAgo(p.createdAt))}</div>
        </div>
      </div>
      <div class="card-question">${escapeHtml(p.question)}</div>
      <div class="card-foot">
        <div class="card-stat"><b>${tv}</b> ${plural(tv, 'голос', 'голоса', 'голосов')}</div>
        <div class="card-stat"><b>${p.options.length}</b> вариантов</div>
        ${hasVoted ? '<div class="card-stat" style="color:var(--success)">✓ вы голосовали</div>' : ''}
      </div>
    `;

    card.addEventListener('click', () => openDetail(p.id));
    attachTilt(card);
    grid.appendChild(card);
  });
}

function plural(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

/* ============ 3D TILT EFFECT ============ */
function attachTilt(el) {
  let raf = null;
  el.addEventListener('mousemove', (e) => {
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (y - 0.5) * -10;
    const ry = (x - 0.5) * 10;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      el.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(10px) scale(1.02)`;
    });
  });
  el.addEventListener('mouseleave', () => {
    if (raf) cancelAnimationFrame(raf);
    el.style.transform = '';
  });
}

/* ============ RENDER DETAIL ============ */
function renderDetail() {
  const wrap = document.getElementById('detailCard');
  const p = DB.polls.find(x => x.id === currentPollId);
  const u = currentUser();
  if (!p || !u) { goHome(); return; }

  const tv = totalVotes(p);
  const hasVoted = p.options.some(o => o.voters.includes(u.key));
  const isOwner = p.author === u.key;
  const showResults = hasVoted || isOwner;

  let html = `
    <div class="detail-head">
      <div class="card-avatar" style="width:38px;height:38px;font-size:14px;background:${colorFor(p.author)}">
        ${escapeHtml(initials(p.authorDisplay || p.author))}
      </div>
      <div>
        <div style="font-weight:700;font-size:14px">${escapeHtml(p.authorDisplay || p.author)}</div>
        <div style="font-size:12px;color:var(--text-dim)">${escapeHtml(timeAgo(p.createdAt))}</div>
      </div>
    </div>
    <div class="detail-question">${escapeHtml(p.question)}</div>
    <div class="options" id="optionsWrap">
  `;

  if (!showResults) {
    p.options.forEach((o, idx) => {
      html += `
        <button class="option-btn" data-idx="${idx}">
          <span class="option-radio"></span>
          <span>${escapeHtml(o.text)}</span>
        </button>
      `;
    });
  } else {
    const maxV = Math.max(1, ...p.options.map(o => o.voters.length));
    p.options.forEach((o) => {
      const n = o.voters.length;
      const pct = tv > 0 ? Math.round(n / tv * 100) : 0;
      const userVoted = o.voters.includes(u.key);
      html += `
        <div class="option-result${userVoted ? ' voted' : ''}" data-count="${n}">
          <div class="option-result-bar" style="width:0"></div>
          <div class="option-result-content">
            <span class="option-result-text">${escapeHtml(o.text)}</span>
            ${userVoted ? '<span class="option-check">✓</span>' : ''}
            <span class="option-pct">${pct}%</span>
          </div>
          <div class="option-voters">${n} ${plural(n, 'голос', 'голоса', 'голосов')}</div>
        </div>
      `;
    });
  }

  html += `</div>`;

  html += `
    <div class="detail-stats">
      <div>Всего голосов: <b>${tv}</b></div>
      <div>Вариантов: <b>${p.options.length}</b></div>
      ${hasVoted ? '<div style="color:var(--success)">✓ вы уже голосовали</div>' : ''}
    </div>
  `;

  if (isOwner) {
    html += `
      <div class="detail-actions">
        <button class="btn btn-danger" onclick="deletePoll('${p.id}')">Удалить опрос</button>
      </div>
    `;
  }

  wrap.innerHTML = html;

  if (!showResults) {
    wrap.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => vote(parseInt(btn.dataset.idx)));
    });
  } else {
    // анимируем полоски
    setTimeout(() => {
      wrap.querySelectorAll('.option-result').forEach(el => {
        const n = parseInt(el.dataset.count);
        const pct = tv > 0 ? (n / tv * 100) : 0;
        const bar = el.querySelector('.option-result-bar');
        if (bar) bar.style.width = pct + '%';
      });
    }, 50);
  }
}

/* ============ VOTE ============ */
function vote(idx) {
  const p = DB.polls.find(x => x.id === currentPollId);
  const u = currentUser();
  if (!p || !u) return;
  if (p.options.some(o => o.voters.includes(u.key))) {
    toast('Вы уже голосовали в этом опросе', 'error');
    return;
  }
  const opt = p.options[idx];
  if (!opt) return;
  opt.voters.push(u.key);
  saveDB();
  toast('Голос учтён!', 'success');
  renderDetail();
}

function deletePoll(id) {
  if (!confirm('Удалить этот опрос? Действие нельзя отменить.')) return;
  const u = currentUser();
  const idx = DB.polls.findIndex(p => p.id === id && p.author === u.key);
  if (idx < 0) { toast('Нельзя удалить чужой опрос', 'error'); return; }
  DB.polls.splice(idx, 1);
  saveDB();
  toast('Опрос удалён', 'success');
  goHome();
}

/* ============ CREATE POLL ============ */
function openCreateModal() {
  document.getElementById('pollQuestion').value = '';
  const wrap = document.getElementById('optionsEdit');
  wrap.innerHTML = '';
  addOption('Да');
  addOption('Нет');
  document.getElementById('createErr').textContent = '';
  document.getElementById('createModal').classList.add('show');
  setTimeout(() => document.getElementById('pollQuestion').focus(), 200);
}

function closeCreateModal() {
  document.getElementById('createModal').classList.remove('show');
}

function addOption(value = '') {
  const wrap = document.getElementById('optionsEdit');
  if (wrap.children.length >= 6) {
    toast('Максимум 6 вариантов', 'error');
    return;
  }
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `
    <input type="text" placeholder="Вариант ${wrap.children.length + 1}" maxlength="80" value="${escapeHtml(value)}">
    <button class="option-remove" title="Удалить">×</button>
  `;
  const input = row.querySelector('input');
  const rm = row.querySelector('.option-remove');
  rm.addEventListener('click', () => {
    if (wrap.children.length <= 2) {
      toast('Минимум 2 варианта', 'error');
      return;
    }
    row.style.opacity = '0';
    row.style.transform = 'translateX(-10px)';
    setTimeout(() => row.remove(), 180);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (wrap.children.length < 6) {
        addOption();
        const inputs = wrap.querySelectorAll('input');
        inputs[inputs.length - 1].focus();
      }
    }
  });
  wrap.appendChild(row);
}

function createPoll() {
  const u = currentUser();
  if (!u) return;
  const q = document.getElementById('pollQuestion').value.trim();
  const err = document.getElementById('createErr');
  const inputs = document.querySelectorAll('#optionsEdit input');
  const options = [];
  inputs.forEach(inp => {
    const v = inp.value.trim();
    if (v) options.push({ text: v, voters: [] });
  });

  if (!q || q.length < 3) { err.textContent = 'Введите вопрос (минимум 3 символа)'; return; }
  if (options.length < 2) { err.textContent = 'Нужно минимум 2 варианта'; return; }
  const seen = new Set();
  for (const o of options) {
    const k = o.text.toLowerCase();
    if (seen.has(k)) { err.textContent = 'Варианты не должны повторяться'; return; }
    seen.add(k);
  }

  const poll = {
    id: uid(),
    author: u.key,
    authorDisplay: u.display,
    question: q,
    options,
    createdAt: Date.now()
  };
  DB.polls.push(poll);
  saveDB();
  closeCreateModal();
  toast('Опрос создан!', 'success');
  goHome();
}

/* ============ BACKGROUND PARTICLES ============ */
(function () {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  let parts = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initParts();
  }
  function initParts() {
    parts = [];
    const count = Math.min(70, Math.floor(W * H / 28000));
    for (let i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: Math.random() * 0.8 + 0.2,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.8 + 0.6
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < parts.length; i++) {
      const a = parts[i];
      a.x += a.vx * a.z;
      a.y += a.vy * a.z;
      if (a.x < 0) a.x = W;
      if (a.x > W) a.x = 0;
      if (a.y < 0) a.y = H;
      if (a.y > H) a.y = 0;

      for (let j = i + 1; j < parts.length; j++) {
        const b = parts[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 22000) {
          const alpha = (1 - d2 / 22000) * 0.18 * Math.min(a.z, b.z);
          ctx.strokeStyle = 'rgba(140, 120, 255, ' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for (const p of parts) {
      const r = p.r * p.z;
      const alpha = 0.15 + p.z * 0.5;
      ctx.fillStyle = 'rgba(160, 200, 255, ' + alpha + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
